# Head
- type: entity
  id: BodyProviderHeadSkeleton
  parent: [BaseBodyProviderPartSkeleton, BaseBodyProviderHeadAppearance, BaseBodyProviderHead]
  components:
  - type: BodyAppearanceProvider
    entries:
    - group: Skin
      path: _White/Bodies/Parts/Humanoids/skeleton.rsi
      state: head-in-body
  - type: Grammar
    attributes:
      proper: true
  - type: Emoting
  - type: Examiner
  - type: Input
    context: "human"
  - type: MobState
    allowedStates:
    - Alive
  - type: SkeletonAccent
  - type: Speech
    speechVerb: Skeleton
  - type: Vocal
    sounds:
      Male: Skeleton
      Female: Skeleton
      Unsexed: Skeleton

