- type: entity
  id: BaseBodyProviderPartSkeleton
  parent: [BaseBodyProviderPartAppearance, BaseBodyProviderPart]
  abstract: true
  suffix: Skeleton
  components:
  - type: MarkingsProvider
    data:
      group: Skeleton
  - type: Sprite
    sprite: _White/Bodies/Parts/Humanoids/skeleton.rsi

# Arms
- type: entity
  id: BodyProviderLeftArmSkeleton
  parent: [BaseBodyProviderPartSkeleton, BaseBodyProviderLeftArmAppearance, BaseBodyProviderLeftArm]
  components:
  - type: BodyAppearanceProvider
    entries:
    - group: Skin
      path: _White/Bodies/Parts/Humanoids/skeleton.rsi
      state: left_arm-in-body # TODO: Ideally, this should be in base.yml, but we don't have icons for each parts. It's sad =(.

- type: entity
  id: BodyProviderRightArmSkeleton
  parent: [BaseBodyProviderPartSkeleton, BaseBodyProviderRightArmAppearance, BaseBodyProviderRightArm]
