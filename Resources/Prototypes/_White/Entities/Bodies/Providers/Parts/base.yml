# Chest
- type: entity
  id: BaseBodyProviderChest
  parent: BaseBodyProviderPart
  abstract: true
  name: chest
  components:
  - type: BodyProvider
    providerType: Chest

- type: entity
  id: BaseBodyProviderChestAppearance
  parent: [BaseBodyProviderChest, BaseBodyProviderPartAppearance]
  abstract: true
  components:
  - type: BodyAppearanceProvider
    layer: enum.BodyProviderType.Chest
  - type: MarkingsProvider
    data:
      layers:
      - enum.BodyProviderType.Chest
      - enum.MarkingVisualLayers.ChestBack
      - enum.MarkingVisualLayers.UndergarmentTop
  - type: Sprite
    layers:
    # Torso
    - map: [ "default" ]
      state: chest
    - map: [ "enum.BodyProviderType.Chest" ]
    - map: [ "enum.BodyProviderType.Groin" ]
    - map: [ "enum.MarkingVisualLayers.ChestBack" ]
    - map: [ "enum.MarkingVisualLayers.GroinBack" ]
    - map: [ "enum.MarkingVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.MarkingVisualLayers.UndergarmentTop" ]
    # Head
    - map: [ "enum.BodyProviderType.Head" ]
    - map: [ "enum.BodyProviderType.Eyes" ]
    - map: [ "enum.MarkingVisualLayers.Face" ]
    - map: [ "enum.MarkingVisualLayers.FacialHair" ]
    - map: [ "enum.MarkingVisualLayers.Hair" ]
    - map: [ "enum.MarkingVisualLayers.HeadBottom" ]
    - map: [ "enum.MarkingVisualLayers.HeadSide" ]
    - map: [ "enum.MarkingVisualLayers.HeadTop" ]
    - map: [ "enum.MarkingVisualLayers.Snout" ]
    # Limbs
    - map: [ "enum.BodyProviderType.LeftLeg" ]
    - map: [ "enum.BodyProviderType.LeftArm" ]
    - map: [ "enum.BodyProviderType.MiddleLeg" ]
    - map: [ "enum.BodyProviderType.MiddleArm" ]
    - map: [ "enum.BodyProviderType.RightLeg" ]
    - map: [ "enum.BodyProviderType.RightArm" ]
    - map: [ "enum.MarkingVisualLayers.LeftArmTop" ]
    - map: [ "enum.MarkingVisualLayers.RightArmTop" ]
    # Extremities
    - map: [ "enum.BodyProviderType.LeftFoot" ]
    - map: [ "enum.BodyProviderType.LeftHand" ]
    - map: [ "enum.BodyProviderType.MiddleFoot" ]
    - map: [ "enum.BodyProviderType.MiddleHand" ]
    - map: [ "enum.BodyProviderType.RightFoot" ]
    - map: [ "enum.BodyProviderType.RightHand" ]
    # Other parts
    - map: [ "enum.BodyProviderType.Wings" ]
    - map: [ "enum.BodyProviderType.Tail" ]

- type: entity
  id: BaseBodyProviderChestOrganic
  parent: [BaseBodyProviderChest, BaseBodyProviderPartOrganic]
  abstract: true
  components:
  - type: PainfulProvider
    location: Chest

