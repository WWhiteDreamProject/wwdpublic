# TODO: Add descriptions

- type: entity
  id: BaseBodyProviderPart
  parent: BaseBodyProvider
  abstract: true
  name: body part
  components:
  - type: BodyProvider
    providerType: Part
  - type: Damageable
    container: BodyProviderPart
  - type: FlavorProfile
    flavors:
    - chicken
  - type: Ingestible
  - type: SolutionContainerManager
    solutions:
      ingestible:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 20
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: WoundableProvider

- type: entity
  id: BaseBodyProviderPartAppearance
  parent: BaseBodyProviderPart
  abstract: true
  components:
  - type: BodyAppearanceProvider
  - type: MarkingsProvider
    data:
      group: None
  - type: Sprite

- type: entity
  id: BaseBodyProviderPartGibbable
  parent: BaseBodyProviderPart
  abstract: true
  components:
  - type: AmputatableProvider
  - type: GibbableProvider

- type: entity
  id: BaseBodyProviderPartOrganic
  parent: BaseBodyProviderPart
  abstract: true
  components:
  - type: BloodstreamProvider
  - type: PainfulProvider

