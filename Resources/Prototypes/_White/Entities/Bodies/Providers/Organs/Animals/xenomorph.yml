- type: entity
  id: BaseBodyProviderOrganXenomorph
  parent: BaseBodyProviderOrgan
  abstract: true
  suffix: Xenomorph
  components:
  - type: Sprite
    sprite: _White/Bodies/Organs/Animals/xenomorph.rsi

- type: entity
  id: BaseMetabolizerXenomorph
  abstract: true
  components:
  - type: Metabolizer
    types: [ Animal, BloodAcid, RespirationPlasma, Xenomorph ]

# Brain
- type: entity
  id: BodyProviderBrainXenomorph
  parent: [BaseBodyProviderBrain, BaseBodyProviderOrganXenomorph]
  name: xenomorph brain
  description: We barely understand the brains of terrestrial animals. Who knows what we may find in the brain of such an advanced species?

# Ears
- type: entity
  id: BodyProviderEarsXenomorph
  parent: [BaseBodyProviderEars, BaseBodyProviderOrganXenomorph]
  name: xenomorph ears
  description: It hears your thoughts before you even speak them. Or at least, that's what it feels like.
  components:
  - type: Sprite
    sprite: _White/Bodies/Organs/Humanoids/human.rsi # TODO: Replace with a unique sprite.

# Gland
- type: entity
  id: BodyProviderGlandAcidXenomorph
  parent: [BaseBodyProviderGland, BaseBodyProviderOrganXenomorph]
  name: xenomorph acid gland
  description: A specialized tank with acid. The resulting corrosive mixture can melt most known materials.
  components:
  - type: Sprite
    state: gland_acid

- type: entity
  id: BodyProviderGlandNeurotoxinXenomorph
  parent: [BaseBodyProviderGland, BaseBodyProviderOrganXenomorph]
  name: xenomorph neurotoxin gland
  description: A specialized tank with neurotoxin. Consists of many microscopic tubes filled with clear liquid.
  components:
  - type: Sprite
    state: gland_neurotoxin

# Heart
- type: entity
  id: BodyProviderHeartXenomorph
  parent: [BaseBodyProviderHeart, BaseBodyProviderOrganXenomorph]
  name: xenomorph heart
  description: The thrum of impending doom. It resonates with the hunger of a thousand hunts.

# Kidneys
- type: entity
  id: BodyProviderKidneysXenomorph
  parent: [BaseBodyProviderKidneys, BaseBodyProviderOrganXenomorph, BaseMetabolizerXenomorph]
  name: xenomorph kidneys
  description: They efficiently remove anything that could slow down the apex predator.
  components:
  - type: Sprite
    sprite: _White/Bodies/Organs/Humanoids/human.rsi # TODO: Replace with a unique sprite.

# Liver
- type: entity
  id: BodyProviderLiverXenomorph
  parent: [BaseBodyProviderLiver, BaseBodyProviderOrganXenomorph, BaseMetabolizerXenomorph]
  name: xenomorph liver
  description: Pairing suggestion involves heavy-duty safety gear and a decontamination shower. Not for snacking.

