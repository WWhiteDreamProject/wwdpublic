# Specific
- type: entity
  id: BodyProviderEggSackXenomorph
  parent: [BaseBodyProviderSpecificOrgan, BaseBodyProviderOrganXenomorph]
  name: xenomorph egg sack
  description: Designed to produce and store eggs containing facehuggers, the organ's enormous size allows the xenomorph queen to lay thousands of eggs in a short period of time.
  components:
  - type: Sprite
    state: egg_sack
  # TODO: Egg sack should give egg spawn action.

- type: entity
  id: BodyProviderResinSpinnerXenomorph
  parent: [BaseBodyProviderSpecificOrgan, BaseBodyProviderOrganXenomorph]
  name: xenomorph resin spinner
  description: Designed for the production and isolation of resin-like biopolymer.
  components:
  - type: Sprite
    state: resin_spinner
  # TODO: Resin spinner should give construction actions.

- type: entity
  id: BodyProviderHiveNodeXenomorph
  parent: [BaseBodyProviderSpecificOrgan, BaseBodyProviderOrganXenomorph]
