- type: entity
  id: BaseBodyProviderOrganArachnid
  parent: BaseBodyProviderOrganOrganic
  abstract: true
  suffix: Arachnid
  components:
  - type: Sprite
    sprite: _White/Bodies/Organs/Humanoids/arachnid.rsi

- type: entity
  id: BaseMetabolizerArachnid
  abstract: true
  components:
