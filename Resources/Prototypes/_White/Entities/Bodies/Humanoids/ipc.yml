              providers:
                right_foot:
                  type: RightFoot
                  startingProvider: BodyProviderRightFootPositronic
              startingProvider: BodyProviderRightLegPositronic
            tail:
              type: Tail
          startingProvider: BodyProviderGroinPositronic
        head:
          type: Head
          providers:
            ears:
              type: Ears
              startingProvider: BodyProviderEarsPositronic
            eyes:
              type: Eyes
              startingProvider: BodyProviderEyesPositronic
