              type: Tongue
              startingProvider: BodyProviderTonguePositronic
          startingProvider: BodyProviderHeadPositronic
        left_arm:
          type: LeftArm
          providers:
            left_hand:
              type: LeftHand
              startingProvider: BodyProviderLeftHandPositronic
          startingProvider: BodyProviderLeftArmPositronic
        right_arm:
          type: RightArm
          providers:
            right_hand:
              type: RightHand
              startingProvider: BodyProviderRightHandPositronic
          startingProvider: BodyProviderRightArmPositronic
