- type: entity
  id: BloodCultPylon
  parent: BaseStructure
  name: pylon
  description: A floating crystal that slowly heals those faithful to Nar'Sie.
  components:
  - type: Sprite
    noRot: true
    sprite: _White/Structures/Furniture/BloodCult/pylon.rsi
    layers:
    - state: icon
      map: [ "enum.PylonVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PylonVisuals.Activated:
        enum.PylonVisuals.Layer:
          True: { state: "icon" }
          False: { state: "icon_off" }
  - type: InteractionOutline
  - type: PointLight
    color: "#FF0000"
    radius: 2
    energy: 2
    enabled: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
  - type: Pylon
    healing:
      Asphyxiation: -10
      Bloodloss: -10
      Blunt: -10
      Caustic: -10
      Cellular: -5
      Cold: -10
      Heat: -10
      Piercing: -10
      Poison: -5
      Radiation: -5
      Shock: -10
      Slash: -10
  - type: DamageOnInteract
    ignoreResistances: true
    popupText : powered-light-component-burn-hand
    damage:
      # WD EDIT: Migrated damage format
      Caustic: 1.2
      Cold: 1.2
      Heat: 1.2
      Shock: 1.2
    blacklist:
      components:
      - BloodCultist
  - type: Construction
    graph: BloodCultPylon
    node: pylon
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      pylonFix:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.3,0.1,0.3"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
