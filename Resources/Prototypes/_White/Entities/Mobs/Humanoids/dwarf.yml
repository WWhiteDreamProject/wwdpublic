- type: entity
  id: MobHumanoidDwarf
  parent:
  - BaseBodyDwarf
  - BaseMobHumanoidOrganic
  name: Urist McDwarf
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: FootPrints
    leftBarePrint: "footprint-left-bare-dwarf"
    rightBarePrint: "footprint-right-bare-dwarf"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 240
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: HideableLayers
    hideLayersOnEquip:
    - enum.MarkingVisualLayers.Hair
    - enum.MarkingVisualLayers.Snout
  - type: HumanoidProfile
    species: Dwarf
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
      jumpsuit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: jumpsuit
      shoes-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: shoes
      gloves-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: gloves
      outerClothing-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: outer
      hardsuit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: hardsuit
      suit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: suit
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    understands:
    - TauCetiBasic
    - SolCommon
  - type: ReplacementAccent
    accent: dwarf
  - type: Speech
    speechSounds: Bass
  - type: Vocal
    sounds:
      Male: UnisexDwarf
      Female: FemaleDwarf
      Unsexed: UnisexDwarf
