- type: entity
  id: MobHumanoidIPC
  parent:
  - BaseBodyIPC
  - BaseMobHumanoid
  name: Urist McIPC
  components:
  - type: AccessReader
    ownerHasAccess: true
  - type: ActiveRadio
  - type: BatteryDrinker
  - type: CRTVisionOverlay
  - type: DeadStartupButton
    sound:
      path: /Audio/Effects/Silicon/startup.ogg
  - type: EmitBuzzWhileDamaged
  - type: EncryptionHolderRequiresLock
  - type: EncryptionKeyHolder
    keySlots: 4
    examineWhileLocked: false
    keysExtractionMethod: Cutting
    keysUnlocked: false
  - type: GuideHelp
    guides:
    - IPC
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
  - type: Inventory
    templateId: ipc
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ItemSlotsRequirePanel
    slots:
      cell_slot: true
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    understands:
    - TauCetiBasic
    - RobotTalk
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
    breakOnAccessBreaker: false
  - type: LockedWiresPanel
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ProtectedFromStepTriggers
    whitelist:
      types:
      - Shard
  - type: PsionicInsulation
  - type: Silicon
    entityType: enum.SiliconType.Player
    batteryPowered: true
    drainPerSecond: 1.5
    chargeThresholdMid: 0.80
    chargeThresholdLow: 0.35
    chargeThresholdCritical: 0.10
    speedModifierThresholds:
      4: 1
      3: 1
      2: 0.80
      1: 0.45
      0: 0.00
  - type: SiliconDownOnDead
  - type: SiliconEmitSoundOnDrained
    sound: "/Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg"
    minInterval: 15
    maxInterval: 30
    popUp: "silicon-power-low"
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.75
      90: 0.5
      120: 0.3
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - SiliconEmotes
    - SiliconMob
  - type: TypingIndicator
    proto: robot
  - type: WeldingHealable
  - type: WiresPanel
    openDelay: 5


