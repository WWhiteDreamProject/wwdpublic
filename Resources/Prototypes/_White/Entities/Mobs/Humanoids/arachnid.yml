- type: entity
  id: MobHumanoidArachnid
  parent:
  - BaseBodyArachnid
  - BaseMobHumanoidOrganic
  name: Urist McArachnid
  components:
  - type: Bloodstream
    reagent: CopperBlood # TODO: CopperBlood -> BloodCopper
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 5
  - type: FootPrints
    leftBarePrint: "footprint-left-bare-spider"
    rightBarePrint: "footprint-right-bare-spider"
  - type: HumanoidProfile
    species: Arachnid
  - type: Hunger
    baseDecayRate: 0.0125
  - type: Inventory
    templateId: arachnid
    speciesId: arachnid
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      Piercing: 5
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch]
      effects:
      - !type:WearableReaction
        slot: head
        prototypeID: WaterDropletHat
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPieReaction
  - type: Sericulture # TODO: A separate organ must be responsible for this.
    action: ActionSericulture
    productionLength: 2
    entityProduced: MaterialWebSilk1
    hungerCost: 4
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter', 'Hiss']
  - type: Tag
    tags:
    - AnomalyHost
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - SpiderCraft
  - type: TypingIndicator
    proto: spider
  - type: Vocal
    sounds:
      Male: UnisexArachnid
      Female: UnisexArachnid
      Unsexed: UnisexArachnid
