- type: entity
  id: MobHumanoidHarpy
  parent:
  - BaseBodyHarpy
  - BaseMobHumanoidOrganic
  name: Urist McHarpy
  components:
  - type: CanMoveInAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.32
        density: 90
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootPrints
    leftBarePrint: "footprint-left-bare-lizard"
    rightBarePrint: "footprint-right-bare-lizard"
  - type: GenericVisualizer
    visuals:
      enum.HarpyVisualLayers.Singing:
        singingLayer:
          False:  {visible: false}
          True:  {visible: true}
  - type: HarpyVisuals
  - type: HumanoidProfile
    species: Harpy
  - type: Inventory
    speciesId: harpy
    templateId: digitigrade
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Harpy/displacement.rsi
            state: jumpsuit
            copyToShaderParameters:
              layerKey: dummy
              parameterTexture: displacementMap
              parameterUV: displacementUV
    femaleDisplacements:
      jumpsuit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Harpy/displacement.rsi
            state: jumpsuit-slim
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - ValyrianStandard
    understands:
    - TauCetiBasic
    - ValyrianStandard
  - type: MeleeWeapon
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      Piercing: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5.5
    weightlessAcceleration: 2.5
    weightlessModifier: 1.12
  - type: ProtectedFromStepTriggers
    whitelist:
      types:
      - Shard
      - Mousetrap
  - type: Singer
    proto: HarpySinger
  - type: Speech
    speechSounds: Harpy
    speechVerb: Harpy
  - type: Tag
    tags:
    - AnomalyHost
    - CanPilot
    - DoorBumpOpener
    - FootstepSound
    - HarpyEmotes
  - type: UltraVision
  - type: Vocal
    sounds:
      Male: SoundsHarpy
      Female: SoundsHarpy
      Unsexed: SoundsHarpy
