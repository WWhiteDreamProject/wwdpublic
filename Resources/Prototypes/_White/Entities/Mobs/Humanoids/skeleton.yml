- type: entity
  id: MobHumanoidSkeleton
  parent:
  - BaseBodySkeleton
  - BaseMobFlammable
  - BaseMobHumanoid
  name: Urist McSkeleton
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:GibBehavior { }
  - type: FireVisuals
    alternateState: Standing
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FlashImmunity
  - type: HumanoidProfile
    species: Skeleton
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Calcic
    understands:
    - TauCetiBasic
    - Calcic
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPieReaction
    - reagents: [ Milk, MilkGoat, MilkSoy, MilkSpoiled ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          # WD EDIT: Migrated damage format
          Blunt: -0.5
          Caustic: -0.5
          Cold: -0.5
          Heat: -0.5
          Piercing: -0.5
          Shock: -0.5
          Slash: -0.5
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "skeleton-healed-by-milk-popup" ]
        probability: 0.25
    - reagents: [ MilkOat ]
      methods: [ Touch ]
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "skeleton-sprayed-by-oat-milk-popup" ]
        probability: 0.5
  - type: SkeletonAccent
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.9
      80: 0.7
  - type: Speech
    speechVerb: Skeleton
  - type: TransferMindOnGib
  - type: TypingIndicator
    proto: skeleton
  - type: Vocal
    sounds:
      Male: Skeleton
      Female: Skeleton
      Unsexed: Skeleton
  - type: ZombieImmune
