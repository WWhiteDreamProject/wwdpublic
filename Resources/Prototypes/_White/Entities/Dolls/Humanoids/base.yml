- type: entity
  id: BaseHumanoidDoll
  parent:
  - BaseBody
  - BaseDoll
  - InventoryBase
  abstract: true
  components:
  - type: Appearance
  - type: BodyAppearance
  - type: ComplexInteraction
  - type: ContainerContainer
  - type: Hands
  - type: HideableLayers
  - type: HumanoidProfile
  - type: Sprite
    layers:
    # Torso
    - map: [ "enum.BodyProviderType.Chest" ]
    - map: [ "enum.BodyProviderType.Groin" ]
    # Head
    - map: [ "enum.BodyProviderType.Head" ]
    - map: [ "enum.BodyProviderType.Eyes" ]
    - map: [ "enum.MarkingVisualLayers.Face" ]
    - map: [ "enum.MarkingVisualLayers.Snout" ]
    # Limbs
    - map: [ "enum.BodyProviderType.LeftArm" ]
    - map: [ "enum.BodyProviderType.RightArm" ]
    - map: [ "enum.BodyProviderType.LeftLeg" ]
    - map: [ "enum.BodyProviderType.RightLeg" ]
    # Underwear & clothing
    - map: [ "enum.MarkingVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.MarkingVisualLayers.UndergarmentTop" ]
    - map: [ "jumpsuit" ]
    # Extremities
    - map: [ "enum.BodyProviderType.LeftFoot" ]
    - map: [ "enum.BodyProviderType.RightFoot" ]
    - map: [ "enum.BodyProviderType.LeftHand" ]
    - map: [ "enum.BodyProviderType.RightHand" ]
    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "suitstorage" ]
    # Stuff that goes in front of equipment
    - map: [ "enum.MarkingVisualLayers.ChestBack" ]
    - map: [ "enum.MarkingVisualLayers.FacialHair" ]
    - map: [ "enum.MarkingVisualLayers.GroinBack" ]
    - map: [ "enum.MarkingVisualLayers.Hair" ]
    - map: [ "enum.MarkingVisualLayers.HeadBottom" ]
    - map: [ "enum.MarkingVisualLayers.HeadSide" ]
    - map: [ "enum.MarkingVisualLayers.HeadTop" ]
    - map: [ "enum.BodyProviderType.Tail" ]
    - map: [ "enum.BodyProviderType.Wings" ]
    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    # Extra stuff
    - map: [ "enum.CuffableVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: UserInterface
    interfaces:
      enum.MarkingModifierKey.Key:
        type: MarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
