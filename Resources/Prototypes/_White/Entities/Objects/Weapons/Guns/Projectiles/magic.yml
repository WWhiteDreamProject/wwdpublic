- type: entity
  id: ProjectileBloodBoil
  parent: BaseBullet
  name: Concentrated Blood
  description: Oh no.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _White/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: blood_boil
      shader: unshaded
  - type: Projectile
    damage:
      # WD EDIT: Migrated damage format
      Blunt: 3.3
      Caustic: 2.5
      Cold: 2.5
      Heat: 2.5
      Piercing: 3.3
      Shock: 2.5
      Slash: 3.3
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: BloodBoilProjectile

- type: entity
  parent: BaseBulletTrigger
  id: ProjectileGauntlet
  name: gauntlet
  description: Oh no.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _White/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: gauntlet_echo
      shader: unshaded
  - type: Projectile
    ignoreResistances: true
    damage:
      # WD EDIT: Migrated damage format
      Blunt: 50
  - type: PointLight
    color: "#FF0000"
    radius: 2.0
    energy: 5.0
