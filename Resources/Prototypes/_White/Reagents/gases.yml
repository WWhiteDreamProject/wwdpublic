- type: reagent
  id: BZ
  name: reagent-name-bz
  desc: reagent-desc-bz
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#e69edd"
  metabolisms:
    Respiration:
      effects:
      - !type:GenericStatusEffect
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 8
        refresh: false
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: BZ
          min: 0.5
        scaleByQuantity: true
        ignoreResistances: true
        damage:
          # WD EDIT: Migrated damage format
          Cellular: 0.0
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          reagent: BZ
          min: 1
        - !type:MetabolizerType
          type: Slime
        type: Local
        visualType: Medium
        messages: [ "effect-sleepy" ]
        probability: 0.1
      - !type:MovespeedModifier
        conditions:
        - !type:ReagentThreshold
          reagent: BZ
          min: 1
        - !type:MetabolizerType
          type: Slime
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: BZ
          min: 1
        - !type:MetabolizerType
          type: Slime
        key: ForcedSleep
        component: ForcedSleeping
        time: 3
        type: Add

