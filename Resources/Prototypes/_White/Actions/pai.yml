- type: entity
  id: ActionPAIManipulatorToggle
  name: Manipulator toggle
  categories: [ HideSpawnMenu ]
  components:
    - type: InstantAction
      checkCanInteract: false
      checkConsciousness: false
      icon:
        sprite: _White/Interface/Actions/pai.rsi
        state: toggle
      useDelay: 1
      event: !type:ManipulatorToggleActionEvent

- type: entity
  id: ActionPAIManipulatorGrabToggle
  name: Manipulator grab toggle
  categories: [ HideSpawnMenu ]
  components:
    - type: InstantAction
      checkCanInteract: false
      checkConsciousness: false
      icon:
        sprite: _White/Interface/Actions/pai.rsi
        state: grab
      useDelay: 1
      event: !type:ManipulatorGrabToggleActionEvent

- type: entity
  id: ActionPAIManipulatorInteract
  name: Use item in manipulator
  categories: [ HideSpawnMenu ]
  components:
    - type: InstantAction
      checkCanInteract: false
      checkConsciousness: false
      icon:
        sprite: _White/Interface/Actions/pai.rsi
        state: interact
      useDelay: 1
      event: !type:ManipulatorInteractActionEvent

- type: entity
  id: ActionPAIManipulatorMove
  name: Move manipulator
  categories: [ HideSpawnMenu ]
  components:
    - type: WorldTargetAction
      checkCanInteract: false
      checkConsciousness: false
      useDelay: 1
      range: 16
      checkCanAccess: false
      repeat: false
      icon:
        sprite: _White/Interface/Actions/pai.rsi
        state: move
      event: !type:ManipulatorMoveActionEvent
