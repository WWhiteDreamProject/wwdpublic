- type: marking
  id: BaseTailVox
  parent: [BaseTail, BaseVox]
  appearance: true
  forcedColoring: true
  abstract: true

- type: marking
  id: TailVoxBalled
  parent: BaseTailVox
  definitions:
  - layer: enum.BodyProviderType.Tail
    sprite:
      sprite: _White/Humanoid/Markings/Vox/tail.rsi
      state: balled

- type: marking
  id: TailVoxDefault
  parent: BaseTailVox
  definitions:
  - layer: enum.BodyProviderType.Tail
    sprite:
      sprite: _White/Bodies/Parts/Humanoids/vox.rsi
      state: tail

- type: marking
  id: TailVoxSplit
  parent: BaseTailVox
  definitions:
  - layer: enum.BodyProviderType.Tail
    sprite:
      sprite: _White/Humanoid/Markings/Vox/tail.rsi
      state: split
