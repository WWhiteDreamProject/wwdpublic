- type: marking
  id: ColorationAbs
  parent: BaseColoration
  groups: [Felinid, Harpy, Human, Oni, Reptilian, Slime]
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Generic/coloration.rsi
      state: abs-chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Generic/coloration.rsi
      state: abs-groin
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Skin

