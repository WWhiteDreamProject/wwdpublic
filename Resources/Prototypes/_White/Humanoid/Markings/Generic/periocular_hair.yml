- type: marking
  id: PeriocularHairEyeArrows
  parent: BasePeriocularHair
  definitions:
  - layer: enum.MarkingVisualLayers.Face
    sprite:
      sprite: _White/Humanoid/Markings/Generic/eyes.rsi
      state: eye_arrows-left
    index: left
  - layer: enum.MarkingVisualLayers.Face
    sprite:
      sprite: _White/Humanoid/Markings/Generic/eyes.rsi
      state: eye_arrows-right
    index: right
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#242424"

