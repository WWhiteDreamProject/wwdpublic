- type: marking
  id: BaseTailHarpy
  parent: [BaseTail, BaseHarpy]
  abstract: true
  appearance: true
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Feathers

- type: marking
  id: TailHarpyDefault
  parent: BaseTailHarpy
  definitions:
  - layer: enum.BodyProviderType.Tail
    sprite:
      sprite: _White/Bodies/Parts/Humanoids/harpy.rsi
      state: tail

- type: marking
  id: TailHarpyFinch
  parent: BaseTailHarpy
  definitions:
  - layer: enum.BodyProviderType.Tail
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/tails36x32.rsi
      state: finch

