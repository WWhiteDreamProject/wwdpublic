- type: marking
  id: BaseEarsHarpy
  parent: [BaseEars, BaseHarpy]
  abstract: true
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
        - !type:SimpleColoring
          color: "#964B00"

- type: marking
  id: EarsHarpyDefault
  parent: BaseEarsHarpy
  definitions:
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/ears.rsi
      state: default

- type: marking
  id: EarsHarpyLarge
  parent: BaseEarsHarpy
  definitions:
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/ears.rsi
      state: large
