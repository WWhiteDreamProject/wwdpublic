- type: marking
  id: BaseWingsHarpy
  parent: [BaseWings, BaseHarpy]
  abstract: true
  appearance: true
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Feathers

- type: marking
  id: WingsHarpyBat
  parent: BaseWingsHarpy
  definitions:
  - layer: enum.MarkingVisualLayers.LeftArmTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/wings.rsi
      state: bat-left-primary
    index: primary
  - layer: enum.MarkingVisualLayers.LeftArmTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/wings.rsi
      state: bat-left-secondary
    index: secondary
  - layer: enum.MarkingVisualLayers.RightArmTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/wings.rsi
      state: bat-right-primary
    index: primary
  - layer: enum.MarkingVisualLayers.RightArmTop
    sprite:
      sprite: _White/Humanoid/Markings/Harpy/wings.rsi
      state: bat-right-secondary
    index: secondary

