- type: marking
  id: BaseColorationArachnid
  parents: [BaseColoration, BaseArachnid]
  abstract: true
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Eyes

- type: marking
  id: ColorationArachnidArrows
  parents: BaseColorationArachnid
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Arachnid/coloration.rsi
      state: arrows_chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Arachnid/coloration.rsi
      state: arrows_groin

