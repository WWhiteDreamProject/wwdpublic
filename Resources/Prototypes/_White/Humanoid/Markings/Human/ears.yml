- type: marking
  id: BaseEarsHuman
  parent: [BaseEars, BaseHuman]
  abstract: true
  forcedColoring: true

- type: marking
  id: EarsHumanCat
  parent: BaseEarsHuman
  definitions:
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Human/ears.rsi
      state: cat-inner
    index: inner
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Human/ears.rsi
      state: cat-outer
    index: outer
  coloring:
    default:
      type: !type:SimpleColoring
    indexes:
      outer:
        type: !type:CategoryColoring
          category: Hair
        fallbackTypes:
        - !type:BodyColorGroupColoring
          group: Skin

- type: marking
  id: EarsHumanLongSmall
  parent: BaseEarsHuman
  definitions:
  - layer: enum.MarkingVisualLayers.HeadSide
    sprite:
      sprite: _White/Humanoid/Markings/Human/ears.rsi
      state: long_small

