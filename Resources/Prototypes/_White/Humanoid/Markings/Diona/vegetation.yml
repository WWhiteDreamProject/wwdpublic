- type: marking
  id: BaseVegetationDiona
  parent: [BaseVegetation, BaseDiona]
  abstract: true

- type: marking
  id: BaseVegetationDionaColorable
  parent: BaseVegetationDiona
  abstract: true
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Skin

- type: marking
  id: VegetationDionaBigFirefly
  parent: BaseVegetationDiona
  definitions:
  - layer: enum.BodyProviderType.Head
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: big_firefly
    shader: unshaded

