- type: marking
  id: BaseVegetationDiona
  parent: [BaseVegetation, BaseDiona]
  abstract: true

- type: marking
  id: VegetationDionaFlowers
  parent: BaseVegetationDiona
  forcedColoring: true
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: flowers-chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: flowers-groin

- type: marking
  id: VegetationDionaLeafCover
  parent: BaseVegetationDiona
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: leaf_cover-chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: leaf_cover-groin
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Skin

- type: marking
  id: VegetationDionaThorns
  parent: BaseVegetationDiona
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: thorns-chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Diona/vegetation.rsi
      state: thorns-groin
