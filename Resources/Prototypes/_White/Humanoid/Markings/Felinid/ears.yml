- type: marking
  id: BaseEarsFelinid
  parent: [BaseEars, BaseFelinid]
  abstract: true
  coloring:
    default:
      type: !type:SimpleColoring
    indexes:
      outer:
        type: !type:CategoryColoring
          category: Hair
        fallbackTypes:
        - !type:BodyColorGroupColoring
          group: Skin

- type: marking
  id: EarsFelinidCurled
  parent: BaseEarsFelinid
  definitions:
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Felinid/ears.rsi
      state: curled-inner
    index: inner
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Felinid/ears.rsi
      state: curled-outer
    index: outer

