- type: marking
  id: BaseHeadMoth
  parent: [BaseHead, BaseMoth]
  abstract: true

- type: marking
  id: BaseHeadMothClassic
  parent: BaseHeadMoth
  abstract: true
  forcedColoring: true
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#FFFFFF"

- type: marking
  id: HeadMothCharred
  parent: BaseHeadMoth
  definitions:
  - layer: enum.BodyProviderType.Head
    sprite:
      sprite: _White/Humanoid/Markings/Moth/head.rsi
      state: charred

