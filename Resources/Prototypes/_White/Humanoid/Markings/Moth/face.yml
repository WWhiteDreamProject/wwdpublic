- type: marking
  id: BaseFaceMoth
  parent: [BaseFace, BaseMoth]
  abstract: true

- type: marking
  id: FaceMothBlush
  parent: BaseFaceMoth
  definitions:
  - layer: enum.MarkingVisualLayers.Face
    sprite:
      sprite: _White/Humanoid/Markings/Moth/face.rsi
      state: blush-left
    index: left
  - layer: enum.MarkingVisualLayers.Face
    sprite:
      sprite: _White/Humanoid/Markings/Moth/face.rsi
      state: blush-right
    index: right
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#E07E7E"

- type: marking
  id: FaceMothLips
  parent: BaseFaceMoth
  definitions:
  - layer: enum.MarkingVisualLayers.Face
    sprite:
      sprite: _White/Humanoid/Markings/Moth/face.rsi
      state: lips
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#7E2727"
