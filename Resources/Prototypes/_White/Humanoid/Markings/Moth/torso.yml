- type: marking
  id: BaseTorsoMoth
  parent: [BaseTorso, BaseMoth]
  abstract: true

- type: marking
  id: BaseTorsoMothClassic
  parent: BaseTorsoMoth
  abstract: true
  forcedColoring: true
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#FFFFFF"

- type: marking
  id: TorsoMothCharred
  parent: BaseTorsoMoth
  definitions:
  - layer: enum.BodyProviderType.Chest
    sprite:
      sprite: _White/Humanoid/Markings/Moth/torso.rsi
      state: charred-chest
  - layer: enum.BodyProviderType.Groin
    sprite:
      sprite: _White/Humanoid/Markings/Moth/torso.rsi
      state: charred-groin

