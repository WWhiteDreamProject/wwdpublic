- type: marking
  id: BaseHornsReptilian
  parent: [BaseHorns, BaseReptilian]
  abstract: true
  coloring:
    default:
      type: !type:BodyColorGroupColoring
        group: Skin

- type: marking
  id: HornsReptilianAngler
  parent: BaseHornsReptilian
  definitions:
  - layer: enum.MarkingVisualLayers.HeadTop
    sprite:
      sprite: _White/Humanoid/Markings/Reptilian/horns.rsi
      state: angler

