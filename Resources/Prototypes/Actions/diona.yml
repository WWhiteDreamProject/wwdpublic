- type: entity
  id: DionaGibAction
  name: Gib Yourself!
  description: Split apart into 3 nymphs.
  components:
  - type: InstantAction
    icon:
      # WD EDIT START
      sprite: _White/Bodies/Organs/Humanoids/diona.rsi
      state: central
      # WD EDIT END
    event: !type:GibActionEvent {}
    checkCanInteract: false
    checkConsciousness: false

- type: entity
  id: DionaReformAction
  name: Reform
  description: Reform back into a whole Diona.
  components:
  - type: InstantAction
    icon:
      sprite: _White/Bodies/Parts/Humanoids/diona.rsi # WD EDIT
      state: full
    event: !type:ReformEvent {}
    useDelay: 600 # Once every 10 minutes. Keep them dead for a fair bit before reforming
