- type: entity
  id: BarberScissors
  name: barber scissors
  description: Is able to reshape the hairstyle of any crew cut to your liking.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Tools/scissors.rsi
    state: icon
  - type: MarkingsModifier
    categories:
    - Hair
    - FacialHair
  - type: ActivatableUI
    key: enum.MarkingModifierKey.Key
    inHandsOnly: true
    requireActiveHand: true
  - type: UserInterface
    interfaces:
      enum.MarkingModifierKey.Key:
        type: MarkingModifierBoundUserInterface
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      # WD EDIT: Migrated damage format
      Piercing: 6
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: DamageOtherOnHit
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
