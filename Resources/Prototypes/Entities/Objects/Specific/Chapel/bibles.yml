- type: entity
  name: bible
  description: New Interstellar Version 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      Blunt: -5
      Caustic: -3.8
      Cold: -3.8
      Heat: -3.8
      Piercing: -5
      Shock: -3.8
      Slash: -5
    damageOnFail:
      Blunt: 5
      Caustic: 3.8
      Cold: 3.8
      Heat: 3.8
      Piercing: 5
      Shock: 3.8
      Slash: 5
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      Caustic: 2.5
      Cold: 2.5
      Heat: 2.5
      Shock: 2.5
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      Blunt: 1
      Holy: 20
    heavyRateModifier: 1.25
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 4
    maxTargets: 4
  - type: Prayable
    bibleUserOnly: true
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: StealTarget
    stealGroup: Bible
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

- type: entity
  parent: [Bible, BaseSyndicateContraband]
  name: necronomicon
  description: "There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      Caustic: 20
    damageOnFail:
      Asphyxiation: 12.5
      Bloodloss: 12.5
      Blunt: 5
      Piercing: 5
      Slash: 5
    damageOnUntrainedUse:
      Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  id: ActionBibleSummon
  name: Summon familiar
  description: Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  components:
  - type: InstantAction
    icon: { sprite: Clothing/Head/Hats/witch.rsi, state: icon }
    event: !type:SummonActionEvent
    useDelay: 1
