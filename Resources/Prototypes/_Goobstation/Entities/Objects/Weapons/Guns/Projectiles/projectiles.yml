
- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletHighCaliber
  name: bullet (.50 anti-materiel)
  components:
  - type: Projectile
    damage:
      # WD EDIT: Migrated damage format
      Piercing: 35
      Structural: 130
- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: BulletHighCaliberExplosive
  name: bullet (.50 high-explosive)
  components:
  - type: Projectile
    damage:
      # WD EDIT: Migrated damage format
      Heat: 5
      Piercing: 10
      Structural: 20
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 2
    intensitySlope: 2
    totalIntensity: 18 # 30 damage per tile
    maxTileBreak: 0
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded

- type: entity
  id: BulletAnaconda
  name: bullet (.40 caseless)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      # WD EDIT: Migrated damage format
      Piercing: 25
